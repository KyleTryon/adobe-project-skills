name: Bug report
description: A command failed, gave a wrong result, or wrote a file Premiere didn't open correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please **don't attach a real project**. If the demo project in `fixtures/premiere-pro/steps/` reproduces it, say which step.
  - type: input
    id: version
    attributes:
      label: Premiere Pro version, OS and Python version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what Premiere showed
    validations:
      required: true
